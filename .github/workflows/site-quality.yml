name: ECO Studios — Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-studios-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static site and editorial-data checks
        run: |
          python -m py_compile scripts/sync_notion.py scripts/report_notion_sync.py scripts/validate_site.py
          node --check scripts/artist-profile-sync.js
          node --check scripts/artist-directory-sync.js
          python scripts/validate_site.py
