name: Sync ECO Studios content from Notion

on:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_notion.py"
      - ".github/workflows/notion-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: eco-studios-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate synchronization script syntax
        run: python -m py_compile scripts/sync_notion.py

      - name: Sync approved Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: "22641827-d2c0-4d3b-bdb2-927b76b08b5b"
        run: python scripts/sync_notion.py

      - name: Commit updated content if changed
        run: |
          if git diff --quiet -- data/eco-content.json; then
            echo "No content changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eco-content.json
          git commit -m "chore: sync approved ECO content from Notion"
          git push
