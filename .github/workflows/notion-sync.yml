name: Sync ECO Studios content from Notion

on:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_notion.py"
      - "scripts/cache_soundcloud_thumbnail.py"
      - "scripts/report_notion_sync.py"
      - ".github/workflows/notion-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: write

concurrency:
  group: eco-studios-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Notion credential without failing scheduled runs
        id: credentials
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -n "${NOTION_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Notion credential is configured; the sync will proceed."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NOTION_TOKEN is not configured. Skipping sync safely; add the repository Actions secret to activate Notion reads."
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache COLKI portrait locally when source is available
        if: steps.credentials.outputs.configured == 'true'
        run: |
          mkdir -p assets
          if [ -s assets/colki.jpg ]; then
            echo "COLKI portrait already cached in the repository."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://d2ol7oe51mr4n9.cloudfront.net/user_3K6TUIpdwDjoRVmxX2NnzXnds1k/91bf43f8-b98d-4851-973a-7110ecec22c7.jpg"
          try:
              request = Request(url, headers={"User-Agent": "ECO-Studios-AssetMirror/1.0"})
              with urlopen(request, timeout=25) as response:
                  content_type = response.headers.get("Content-Type", "").lower()
                  image_bytes = response.read(5_000_001)
              if not content_type.startswith("image/") or len(image_bytes) < 10_000 or len(image_bytes) > 5_000_000:
                  raise ValueError(f"Unexpected image response: type={content_type!r}, bytes={len(image_bytes)}")
              Path("assets/colki.jpg").write_bytes(image_bytes)
              print(f"Cached COLKI portrait locally ({len(image_bytes)} bytes; {content_type}).")
          except Exception as exc:
              print(f"::warning::Could not cache COLKI portrait; keeping the external fallback this run: {exc}")
          PY

      - name: Validate synchronization script syntax
        if: steps.credentials.outputs.configured == 'true'
        run: python -m py_compile scripts/sync_notion.py

      - name: Sync approved Notion content
        if: steps.credentials.outputs.configured == 'true'
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: "22641827-d2c0-4d3b-bdb2-927b76b08b5b"
        run: python scripts/sync_notion.py

      - name: Commit updated content and locally cached image if changed
        if: steps.credentials.outputs.configured == 'true'
        id: publish
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: "22641827-d2c0-4d3b-bdb2-927b76b08b5b"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A content commit can race with another main-branch update. Re-read Notion
          # against the newest main, then try a normal fast-forward push up to 3 times.
          # Never force-push and never resolve a content conflict by overwriting main.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            # Mirror LK's official SoundCloud thumbnail to a stable local asset.
            # If SoundCloud is temporarily unavailable, the script preserves the last verified copy.
            python scripts/cache_soundcloud_thumbnail.py
            python scripts/sync_notion.py

            git add -- data/eco-content.json
            if [ -s assets/colki.jpg ]; then git add -- assets/colki.jpg; fi
            for portrait in assets/lk-soundcloud-thumbnail.*; do
              if [ -s "$portrait" ]; then git add -- "$portrait"; fi
            done

            if git diff --cached --quiet; then
              echo "No content changes to publish."
              exit 0
            fi

            git commit -m "chore: sync ECO content and cache artist portraits"
            if git push origin HEAD:main; then
              echo "Updated editorial content pushed to main."
              exit 0
            fi

            echo "::warning::main moved during publish attempt ${attempt}; retrying from latest main."
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

          echo "::error::Could not publish after 3 safe attempts; no force push was attempted."
          exit 1

      - name: Verify public JSON matches synchronized content
        id: verify_live
        if: steps.credentials.outputs.configured == 'true' && steps.sync.outcome == 'success' && steps.publish.outcome == 'success'
        env:
          PUBLIC_JSON_URL: "https://martingfilippi-dotcom.github.io/eco-studios/data/eco-content.json"
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.request import Request, urlopen
          from pathlib import Path

          expected = json.loads(Path("data/eco-content.json").read_text(encoding="utf-8"))
          base_url = os.environ["PUBLIC_JSON_URL"]
          last_error = "public JSON did not match the repository copy"
          for attempt in range(1, 11):
              request_url = f"{base_url}?sync_check={time.time_ns()}_{attempt}"
              request = Request(request_url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"})
              try:
                  with urlopen(request, timeout=15) as response:
                      actual = json.load(response)
                  if actual != expected:
                      last_error = "public JSON is reachable but differs from the expected JSON"
                      print(f"Public JSON not current yet (attempt {attempt}/10).")
                      if attempt < 10:
                          time.sleep(12)
                      continue

                  lk = next((item for item in actual.get("items", [])
                             if str(item.get("slug", "")).lower() == "lk"), None)
                  image_url = (lk or {}).get("imageUrl") or ""
                  if "lk-soundcloud-thumbnail." in image_url:
                      image_request = Request(
                          f"{image_url}?image_check={time.time_ns()}_{attempt}",
                          headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
                      )
                      with urlopen(image_request, timeout=15) as response:
                          image_bytes = response.read(5_000_001)
                          content_type = response.headers.get("Content-Type", "").split(";", 1)[0].lower()
                      if not content_type.startswith("image/") or len(image_bytes) < 10_000:
                          raise ValueError(f"LK thumbnail is not served as a valid image: {content_type}, {len(image_bytes)} bytes")
                      if not (image_bytes.startswith(b"\\xff\\xd8\\xff")
                              or image_bytes.startswith(b"\\x89PNG\\r\\n\\x1a\\n")
                              or (image_bytes[:4] == b"RIFF" and image_bytes[8:12] == b"WEBP")):
                          raise ValueError("LK thumbnail response has no recognized image signature")
                      print(f"Public JSON verified and LK's cached SoundCloud thumbnail is served ({content_type}, {len(image_bytes)} bytes).")
                  else:
                      print("Public JSON verified. LK has no cached SoundCloud image URL in the current payload.")
                  sys.exit(0)
              except Exception as exc:
                  last_error = str(exc)
                  print(f"Public JSON/image check attempt {attempt}/10 did not pass: {exc}")
              if attempt < 10:
                  time.sleep(12)
          print(f"::error::Public JSON and LK thumbnail could not be verified: {last_error}")
          sys.exit(1)
          PY

      - name: Report actual sync result to Notion
        if: always() && steps.credentials.outputs.configured == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: "22641827-d2c0-4d3b-bdb2-927b76b08b5b"
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          LIVE_VERIFY_OUTCOME: ${{ steps.verify_live.outcome }}
        run: python scripts/report_notion_sync.py
